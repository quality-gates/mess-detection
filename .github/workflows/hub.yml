name: Hub

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    name: Hub contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.23"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install the fixture parser
        run: npm install --prefix "$RUNNER_TEMP/explicitness-tools" --ignore-scripts --no-audit --no-fund typescript@5.9.3
      - name: Run hub contract tests
        env:
          REQUIRE_HOST_TOOLS: "1"
          TYPESCRIPT_MODULE: ${{ runner.temp }}/explicitness-tools/node_modules/typescript
        run: |
          python3 tests/hub_contract_test.py
          python3 -m unittest discover -s tests -p 'test_*.py'
