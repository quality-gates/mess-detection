name: Explicitness conformance

on:
  workflow_call:
    inputs:
      language:
        required: true
        type: string
      contract_ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  conformance:
    name: Native explicitness contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LANGUAGE: ${{ inputs.language }}
      CONTRACT_REF: ${{ inputs.contract_ref }}
      DETECTOR: ${{ github.workspace }}/detector
      RUST_CONTAINER: explicitness-rust-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Validate the contract and repository identity
        env:
          CALLER: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os
          import re
          repositories = {
              "python": "quality-gates/messpy",
              "typescript": "quality-gates/messcript",
              "go": "quality-gates/messgo",
              "fsharp": "quality-gates/messfsharp",
              "csharp": "quality-gates/messharp",
              "rust": "quality-gates/messrust",
          }
          assert repositories.get(os.environ["LANGUAGE"]) == os.environ["CALLER"], "Unsupported detector identity"
          assert re.fullmatch(r"[0-9a-f]{40}", os.environ["CONTRACT_REF"]), "Pin the contract to a commit"
          PY
      - name: Check out the exact detector head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: detector
      - name: Check out the pinned shared contract
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: quality-gates/mess-detection
          ref: ${{ inputs.contract_ref }}
          path: contract
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Set up Node
        if: inputs.language == 'typescript'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Go
        if: inputs.language == 'go'
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: detector/go.mod
      - name: Set up F# SDK
        if: inputs.language == 'fsharp'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.302'
      - name: Build the native CLI
        working-directory: detector
        shell: bash
        run: |
          set -euo pipefail
          case "$LANGUAGE" in
            python) : ;;
            typescript) npm ci && npm run build ;;
            go) GOMAXPROCS=2 go build -o "$RUNNER_TEMP/messgo" ./cmd/messgo ;;
            fsharp) dotnet build src/MessFSharp -c Release -m:1 ;;
            csharp) scripts/dotnet.sh build src/MessSharp -c Release -m:1 ;;
            rust)
              docker build -f dev.Dockerfile -t explicitness-rust-image .
              docker run -d --rm --init --name "$RUST_CONTAINER" \
                --cpus=2 --memory=4g --memory-swap=4g --pids-limit=512 \
                --tmpfs /workspace/target:rw,exec,size=2g \
                --tmpfs /tmp:rw,exec,size=1g \
                -v "$DETECTOR:/workspace" explicitness-rust-image sleep 1800
              docker exec "$RUST_CONTAINER" cargo build --locked
              ;;
          esac
      - name: Exercise the native CLI
        shell: bash
        run: |
          set -euo pipefail
          case "$LANGUAGE" in
            python)
              export PYTHONPATH="$DETECTOR/src"
              command="python3 -c 'from messpy.cli import main; main()'"
              ;;
            typescript) command="node $DETECTOR/dist/cli.js" ;;
            go) command="$RUNNER_TEMP/messgo" ;;
            fsharp) command="dotnet $DETECTOR/src/MessFSharp/bin/Release/net10.0/messfsharp.dll" ;;
            csharp)
              cat > "$RUNNER_TEMP/explicitness-cli" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          fixture="$1"
          shift
          [[ "$fixture" == "$DETECTOR/"* ]]
          exec "$DETECTOR/scripts/dotnet.sh" exec /src/src/MessSharp/bin/Release/net8.0/messharp.dll "/src/${fixture#"$DETECTOR/"}" "$@"
          SH
              command="bash $RUNNER_TEMP/explicitness-cli"
              ;;
            rust)
              cat > "$RUNNER_TEMP/explicitness-cli" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          fixture="$1"
          shift
          [[ "$fixture" == "$DETECTOR/"* ]]
          exec docker exec "$RUST_CONTAINER" ./target/debug/messrust "/workspace/${fixture#"$DETECTOR/"}" "$@"
          SH
              command="bash $RUNNER_TEMP/explicitness-cli"
              ;;
          esac
          python3 contract/tests/explicitness_conformance.py \
            --language "$LANGUAGE" --command "$command" \
            --fixture-root "$DETECTOR/.conformance-fixtures" \
            --output "$RUNNER_TEMP/explicitness-observations.json"
      - name: Preserve native observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: explicitness-${{ inputs.language }}
          path: ${{ runner.temp }}/explicitness-observations.json
          if-no-files-found: ignore
      - name: Stop the Rust test container
        if: always() && inputs.language == 'rust'
        run: docker rm -f "$RUST_CONTAINER" || true
